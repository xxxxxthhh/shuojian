<!doctype html>
<meta charset="utf-8">
<title>说剑 · 敌人试炼场</title>
<style>
  html,body{margin:0;height:100%;background:#141310;overflow:hidden;
            font:12px/1.5 "Songti SC","STSong",serif;color:#efe7d8}
  canvas{display:block;margin:0 auto;image-rendering:auto}
  #panel{position:fixed;top:0;right:0;width:252px;height:100%;overflow-y:auto;
         background:rgba(20,19,16,.90);border-left:1px solid #4a453c;
         padding:8px 10px 40px;box-sizing:border-box;font-size:11px}
  #panel.hide{display:none}
  h3{margin:10px 0 4px;font-size:11px;color:#c8a55b;font-weight:normal;
     border-bottom:1px solid #3a352d;padding-bottom:2px}
  h3:first-child{margin-top:0}
  button{font:11px/1.4 inherit;background:#2b2822;color:#efe7d8;border:1px solid #55503f;
         border-radius:2px;padding:3px 5px;margin:1px;cursor:pointer}
  button:hover{background:#3d3830}
  button.on{background:#b03a2b;border-color:#d4553f}
  label{display:block;margin:2px 0;cursor:pointer}
  input[type=range]{width:100%}
  .row{display:flex;flex-wrap:wrap;gap:2px}
  #stats{font:10px/1.35 ui-monospace,Menlo,monospace;white-space:pre;color:#a8a094}
  .hint{color:#6f6a60;font-size:10px;margin:3px 0}
</style>

<canvas id="c"></canvas>
<div id="panel"></div>

<!-- 按 index.html 的顺序加载；带版本号是为了绕开浏览器缓存，
     不然改完 src 刷新页面还是旧代码（自动化迭代时非常致命）。 -->
<script>
(function () {
  var v = '?v=' + Date.now();
  var srcs = [
    '../src/core/const.js',
    '../src/core/input.js',
    '../src/core/camera.js',
    '../src/core/world.js',
    '../src/core/ent.js',
    '../src/core/save.js',
    '../src/core/game.js',
    '../src/render/ink.js',
    '../src/render/figure.js',
    '../src/render/fx.js',
    '../src/audio/audio.js',
    '../src/combat/combat.js',
    '../src/combat/tech.js',
    '../src/entity/player.js',
    '../src/entity/ai.js',
    '../src/entity/enemies.js',
    '../src/entity/bosses.js'
  ];
  for (var i = 0; i < srcs.length; i++) document.write('<scr' + 'ipt src="' + srcs[i] + v + '"><\/scr' + 'ipt>');
})();
</script>

<script>
(function () {
  'use strict';
  var SJ = window.SJ;

  // ── 试炼场 ────────────────────────────────────────────────
  var GY = 470, LV = {
    solids: [
      [0, GY, 2400, 90, 0],
      [-40, -300, 40, 900, 0],
      [2400, -300, 40, 900, 0],
      [430, 360, 220, 14, 1],
      [920, 296, 210, 14, 1],
      [1320, 386, 170, 84, 0],
      [1730, 330, 270, 14, 1]
    ]
  };

  var D = {
    lock: false, god: false, ink: false, bot: false, hidePanel: false,
    lat: 0.30, wind: 1.0
  };
  var stats = {};          // "敌人:招" -> {p:格挡数, h:挨打数}
  function wipeStats() { for (var k in stats) delete stats[k]; }
  var botClock = 0, seen = {}, botHold = 0, botDown = false;
  var focus = null;        // 当前观察的敌人

  // ── 合成按键（给反应机器人用；Input 按 e.code 认键）────────
  function key(code, down) {
    window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup',
      { code: code, bubbles: true }));
  }

  // ── 统计钩子 ──────────────────────────────────────────────
  function tag(hb) {
    var o = hb && hb.owner;
    if (!o) return '?';
    return (o.id || o.tag) + ':' + (o.mv ? o.mv.d.id : (hb.moveId || '-'));
  }
  function bump(k, f) {
    var s = stats[k] || (stats[k] = { p: 0, h: 0 });
    s[f]++;
  }

  function hook(p) {
    var op = p.onParry, oh = p.hurt;
    p.onParry = function (src, hb) { bump(tag(hb), 'p'); return op.apply(this, arguments); };
    p.hurt = function (dmg, src, opt) {
      if (D.god && dmg > 0) { opt = opt || {}; dmg = 0; }
      if (opt && opt.hb && opt.hb.team === 'foe') bump(tag(opt.hb), 'h');
      return oh.call(this, dmg, src, opt);
    };
  }

  // ── 锁定 AI ───────────────────────────────────────────────
  function applyLock() {
    SJ.Ent.each(function (e) {
      if (e === SJ.player || e.tag === 'arrow' || e.tag === 'wave') return;
      if (D.lock && !e.__upd) { e.__upd = e.update; e.update = function () { }; }
      else if (!D.lock && e.__upd) { e.update = e.__upd; e.__upd = null; }
    });
  }

  // ── 生成 ──────────────────────────────────────────────────
  function foes() {
    var out = [], L = SJ.Ent.list, i;
    for (i = 0; i < L.length; i++) {
      if (!L[i].dead && L[i].team === 'foe' && L[i].def) out.push(L[i]);
    }
    return out;
  }

  function clearFoes() {
    var L = SJ.Ent.list.slice(), i;
    for (i = 0; i < L.length; i++) if (L[i] !== SJ.player) SJ.Ent.remove(L[i]);
    SJ.Combat.clear();
    focus = null;
  }

  function spawn(kind, id, dx) {
    var x = SJ.clamp(SJ.player.cx() + (dx === undefined ? 300 : dx), 40, 2360);
    var e = (kind === 'boss' ? SJ.Bosses : SJ.Enemies)
      .spawn(id, x, GY, { facing: -1, windMul: D.wind });
    if (!e) return null;
    if (kind === 'boss') e.onDefeat = function (b) {
      SJ.FX.word(b.cx(), b.cy() - 70, '倒地 · 等生杀', { color: SJ.C.cinnabar, life: 2.2, size: 15 });
      console.log('[试炼场] onDefeat 触发：' + b.id + '（hp=' + b.hp + ' dead=' + b.dead + '）');
    };
    focus = e;
    applyLock();
    return e;
  }

  // ── 面板 ──────────────────────────────────────────────────
  var MOBS = [['daoke', '刀客'], ['gongshou', '弓手'], ['qiangbing', '枪兵'],
              ['lishi', '力士'], ['sengren', '僧人'], ['cike', '刺客'], ['denglong', '提灯人']];
  var BOSSES = [['yuzhongdao', '雨中刀'], ['dizi', '铁笛先生'], ['laoweng', '渡口老翁'],
                ['baiyi', '白衣'], ['shouge', '守阁人'], ['shixiong', '师兄']];

  function el(tag, html, parent) {
    var e = document.createElement(tag);
    if (html != null) e.innerHTML = html;
    (parent || panel).appendChild(e);
    return e;
  }
  var panel = document.getElementById('panel'), statsEl;

  function toggle(label, keyName, after) {
    var b = el('button', label);
    b.onclick = function () {
      D[keyName] = !D[keyName];
      b.className = D[keyName] ? 'on' : '';
      if (after) after();
    };
    return b;
  }

  function buildPanel() {
    el('h3', '杂兵');
    var r1 = el('div'); r1.className = 'row';
    MOBS.forEach(function (m) {
      var b = el('button', m[1], r1);
      b.onclick = function () { spawn('mob', m[0]); };
    });
    el('h3', 'Boss');
    var r2 = el('div'); r2.className = 'row';
    BOSSES.forEach(function (m) {
      var b = el('button', m[1], r2);
      b.onclick = function () { spawn('boss', m[0]); };
    });

    el('h3', '编组（教组合威胁）');
    var r3 = el('div'); r3.className = 'row';
    [['弓+枪', function () { spawn('mob', 'gongshou', 420); spawn('mob', 'qiangbing', 240); }],
     ['刀×3', function () { spawn('mob', 'daoke', 240); spawn('mob', 'daoke', 380); spawn('mob', 'daoke', -260); }],
     ['僧+弓', function () { spawn('mob', 'sengren', 200); spawn('mob', 'gongshou', 430); }],
     ['白衣+影', function () { var b = spawn('boss', 'baiyi', 300); if (b) b.setPhase(3); }]
    ].forEach(function (p) {
      var b = el('button', p[0], r3); b.onclick = p[1];
    });

    el('h3', '调试');
    var r4 = el('div'); r4.className = 'row';
    var bh = el('button', 'hitbox', r4);
    bh.onclick = function () {
      SJ.Combat.debug.hitbox = !SJ.Combat.debug.hitbox;
      bh.className = SJ.Combat.debug.hitbox ? 'on' : '';
    };
    var bt = el('button', '轨迹常显', r4);
    bt.onclick = function () {
      SJ.Combat.debug.tgAlways = !SJ.Combat.debug.tgAlways;
      bt.className = SJ.Combat.debug.tgAlways ? 'on' : '';
    };
    r4.appendChild(toggle('锁AI', 'lock', applyLock));
    r4.appendChild(toggle('无敌', 'god'));
    r4.appendChild(toggle('满墨', 'ink'));
    var bc = el('button', '清场', r4); bc.onclick = clearFoes;
    var bs = el('button', '敌人总表', r4);
    bs.onclick = function () { (SJ.Game.scene === sheet ? toArena : toSheet)(); };

    el('h3', 'Boss 阶段');
    var r5 = el('div'); r5.className = 'row';
    [1, 2, 3].forEach(function (n) {
      var b = el('button', 'P' + n, r5);
      b.onclick = function () { if (focus && focus.boss) focus.setPhase(n); };
    });
    var br = el('button', '回满血', r5);
    br.onclick = function () { if (focus) focus.hp = focus.maxHp; };

    el('h3', '起手式倍率 <span id="wv">1.00</span>');
    var sw = el('input'); sw.type = 'range'; sw.min = 55; sw.max = 130; sw.value = 100;
    sw.oninput = function () {
      D.wind = sw.value / 100;
      document.getElementById('wv').textContent = D.wind.toFixed(2);
      foes().forEach(function (e) { e.windMul = D.wind; });
    };

    el('h3', '反应机器人');
    el('div', '起手式出现后延迟 <span id="lv">0.30</span>s 按住观势，' +
      '统计每一招格开/挨打次数。', panel).className = 'hint';
    var r6 = el('div'); r6.className = 'row';
    r6.appendChild(toggle('开', 'bot'));
    var bz = el('button', '清统计', r6);
    bz.onclick = wipeStats;
    var bp = el('button', '打印', r6);
    bp.onclick = printStats;
    var sl = el('input'); sl.type = 'range'; sl.min = 10; sl.max = 60; sl.value = 30;
    sl.oninput = function () {
      D.lat = sl.value / 100;
      document.getElementById('lv').textContent = D.lat.toFixed(2);
    };

    el('h3', '招式');
    var r7 = el('div'); r7.className = 'row';
    var ba = el('button', '学会全部 12 招', r7);
    ba.onclick = function () {
      for (var k in SJ.Tech.defs) SJ.Tech.learn(SJ.Tech.defs[k].id || k);
      if (SJ.Tech.defs.length !== undefined) {
        SJ.Tech.defs.forEach(function (d) { SJ.Tech.learn(d.id); });
      }
      renderSlots();
    };
    var slotsEl = el('div', '', panel); slotsEl.id = 'slots'; slotsEl.className = 'hint';
    window.renderSlots = function () {
      slotsEl.textContent = 'U/I/O/P → ' + (SJ.Save.data.slots || []).join(' / ');
    };
    var r8 = el('div'); r8.className = 'row';
    [['wufeng', '无锋'], ['hengyun', '横云断'], ['chuanyang', '穿杨'], ['shuojian', '说剑']]
      .forEach(function (m) {
        var b = el('button', '装 ' + m[1], r8);
        b.onclick = function () {
          SJ.Tech.learn(m[0]);
          SJ.Save.data.slots[0] = m[0];
          renderSlots();
        };
      });

    el('h3', '统计');
    statsEl = el('pre'); statsEl.id = 'stats';

    el('h3', '键');
    el('div', 'AD 走 · 空格 跳 · J 攻 · <b>K 观势</b> · L 身法 · UIOP 招式<br>' +
      'H 隐藏面板 · R 复位玩家 · 数字键 1-7 生杀兵 · Q 打印统计', panel).className = 'hint';
  }

  function printStats() {
    var k, s, lines = ['moveId                      格开  挨打   格开率'];
    for (k in stats) {
      s = stats[k];
      lines.push((k + '                          ').slice(0, 26) +
        String(s.p + '    ').slice(0, 5) + String(s.h + '    ').slice(0, 5) +
        '  ' + (s.p + s.h ? Math.round(s.p / (s.p + s.h) * 100) : 0) + '%');
    }
    console.log('[试炼场·公平性] 延迟 ' + D.lat.toFixed(2) + 's / 起手倍率 ' +
      D.wind.toFixed(2) + '\n' + lines.join('\n'));
  }

  function renderStats() {
    if (!statsEl) return;
    var k, s, out = [];
    for (k in stats) {
      s = stats[k];
      out.push((k + '                    ').slice(0, 20) + ' ' +
        ('  ' + s.p).slice(-3) + ' /' + ('  ' + s.h).slice(-3) + '  ' +
        (s.p + s.h ? Math.round(s.p / (s.p + s.h) * 100) : 0) + '%');
    }
    statsEl.textContent = out.length ? out.join('\n') : '（空）';
  }

  // ── 反应机器人 ────────────────────────────────────────────
  function bot(raw) {
    botClock += raw;
    if (!D.bot) {
      if (botDown) { key('KeyK', false); botDown = false; }
      return;
    }
    var T = SJ.Combat.tgList, i, want = false, alive = {};
    for (i = 0; i < T.length; i++) {
      var tg = T[i];
      alive[tg.id] = 1;
      if (!tg.danger) continue;
      if (!seen[tg.id]) seen[tg.id] = botClock;
      if (botClock - seen[tg.id] >= D.lat) want = true;
    }
    // 飞来的东西（箭、音波、冲撞的身体）也是「起手式」：
    // 它们的落点比 telegraph 结束晚得多，只盯虚线的机器人会被打中，人不会
    var H = SJ.Combat.hitList, p = SJ.player;
    for (i = 0; i < H.length; i++) {
      var hb = H[i];
      if (hb.team !== 'foe') continue;
      // 半径放到 600：箭一出弦就该开始计反应时间，而不是等它飞到脸上。
      // 人是看着箭飞过来的，机器人也该这样，否则统计出来的「不公平」是假的。
      var d = Math.abs(hb.x + hb.w / 2 - p.cx());
      if (d > 600) continue;
      var k = 'h' + hb.id;
      if (!seen[k]) seen[k] = botClock;
      alive[k] = 1;
      if (botClock - seen[k] >= D.lat) want = true;
    }
    // 起手式消失后再多按 0.22s：招式落点常常在 telegraph 结束的下一帧
    if (want) botHold = 0.22;
    else if (botHold > 0) { botHold -= raw; want = true; }

    if (want && !botDown) { key('KeyK', true); botDown = true; }
    else if (!want && botDown) { key('KeyK', false); botDown = false; }

    if (SJ.Game.frame % 240 === 0) {
      for (var k in seen) if (!alive[k] && botClock - seen[k] > 6) delete seen[k];
    }
  }

  // ── 场景 ──────────────────────────────────────────────────
  var scene = {
    enter: function () {
      SJ.World.load(LV);
      SJ.Camera.setBounds(0, 2400, -260, 560);
      var p = SJ.Player.create(200, GY - 52);
      hook(p);
      SJ.Camera.snap(p.cx(), p.cy());
    },

    update: function (dt) {
      bot(SJ.Game.rawDt);

      // 决议 005 §3 的顺序
      SJ.Ent.updateAll(dt);
      SJ.Tech.update(dt);
      SJ.Combat.update(dt);
      SJ.FX.update(dt);
      SJ.Camera.follow(SJ.player, dt);

      var p = SJ.player;
      // 无敌 = 伤害归零（在 hook 里做），不是 invuln —— invuln 会让 combat
      // 在调用 hurt 之前就 return，统计就全丢了
      if (D.god) p.hp = p.maxHp;
      if (D.ink) p.ink = p.maxInk;
      if (p.y > 900 || p.state === 'dead' && p.st > 1.6) p.respawn(200, GY - 60);
      if (focus && (focus.dead || focus.hp <= 0 && !focus.boss)) focus = null;
      if (!focus) { var f = foes(); focus = f[0] || null; }
      if (SJ.Game.frame % 12 === 0) renderStats();
    },

    draw: function (g) {
      SJ.Ink.paper(g, SJ.Camera.x, SJ.Camera.y);
      SJ.Ink.mountains(g, SJ.Camera.x, 2, {});
      SJ.Ink.mountains(g, SJ.Camera.x, 1, {});

      SJ.Camera.apply(g);
      // 地形
      var i, s;
      for (i = 0; i < SJ.World.solids.length; i++) {
        s = SJ.World.solids[i];
        if (s.gone) continue;
        if (s.oneway) {
          SJ.Ink.stroke(g, [[s.x, s.y], [s.x + s.w, s.y]],
            { w0: 3, w1: 2, color: SJ.C.ink2, alpha: 0.7, seed: i * 7 });
        } else {
          SJ.Ink.wash(g, s.x, s.y, s.w, Math.min(s.h, 200),
            { color: SJ.C.ink, alpha: 0.16 });
          SJ.Ink.stroke(g, [[s.x, s.y], [s.x + s.w * 0.5, s.y - 1.5], [s.x + s.w, s.y]],
            { w0: 4, w1: 2.5, color: SJ.C.ink, alpha: 0.85, seed: i * 13 });
        }
      }
      SJ.Ent.drawAll(g);
      SJ.Combat.draw(g);
      SJ.FX.draw(g);

      // 起手式剩余时间（调试）
      if (SJ.Combat.debug.tgAlways || SJ.Combat.debug.hitbox) {
        g.font = '11px ui-monospace,monospace';
        g.fillStyle = SJ.C.cinnabar;
        var T = SJ.Combat.tgList;
        for (i = 0; i < T.length; i++) {
          var tg = T[i];
          if (!tg.owner) continue;
          g.fillStyle = tg.danger ? SJ.C.cinnabar : SJ.C.stone;
          g.fillText((tg.moveId || '-') + ' ' + (tg.dur - tg.t).toFixed(2) + 's',
            tg.owner.cx() - 26, tg.owner.y - 16);
        }
      }
      SJ.Camera.restore(g);

      // 墨褪色（G 的活，这里照做一次，好看清墨低时敌人还读不读得出来）
      var tint = SJ.Player.inkTint();
      if (tint < 0.999) {
        g.globalAlpha = (1 - tint) * 0.72;
        g.fillStyle = SJ.C.paper;
        g.fillRect(0, 0, SJ.W, SJ.H);
        g.globalAlpha = 1;
      }

      hud(g);
    }
  };

  function hud(g) {
    var p = SJ.player;
    g.font = '12px ui-monospace,Menlo,monospace';
    g.fillStyle = SJ.C.ink;
    g.globalAlpha = 0.85;
    g.fillText('HP ' + Math.ceil(p.hp) + '/' + p.maxHp +
      '   墨 ' + Math.round(p.ink) + '   ' + p.state +
      (p.observing ? ' [观势]' : ''), 10, 18);

    if (focus) {
      var f = focus;
      g.fillText(f.def.name + '  HP ' + Math.max(0, Math.ceil(f.hp)) + '/' + f.maxHp +
        '  P' + f.phase +
        (f.act === 'down' ? ' [倒地]' : '') +
        (f.mv ? '  ' + f.mv.d.name + '·' + f.mv.ph : '') +
        (f.stunT > 0 ? '  硬直' + f.stunT.toFixed(2) : '') +
        (f.armorT > 0 ? '  霸体' : '') +
        (f.openT > 0 ? '  破防' + f.openT.toFixed(1) : ''), 10, 34);
      // Boss 血条：一道墨线（只给 Boss，杂兵不画）
      if (f.boss) {
        var w = 300 * SJ.clamp(f.hp / f.maxHp, 0, 1);
        g.globalAlpha = 0.5;
        g.fillStyle = SJ.C.inkLight; g.fillRect(SJ.W / 2 - 150, 500, 300, 3);
        g.fillStyle = SJ.C.cinnabar; g.fillRect(SJ.W / 2 - 150, 500, w, 3);
      }
    }
    if (D.bot) {
      g.globalAlpha = 0.8; g.fillStyle = SJ.C.stone;
      g.fillText('机器人 ' + D.lat.toFixed(2) + 's' + (botDown ? ' ●' : ''), 10, 50);
    }
    g.globalAlpha = 1;
  }


  // ── 敌人总表（T3）─────────────────────────────────────────
  // 按游戏内真实缩放画 13 个角色 × 待机/起手/受击。
  // 要看的是**小尺寸下的线宽**：figure.js 的笔宽是 w * lineScale，
  // 整个人又被 g.scale(scale) 缩过一道，所以纸上的实际墨重 = scale × lineScale。
  // 方案 A = 现状（Lead 已拍板落地：轻的抬到有效墨重 1.0，刻意加重的不动）；
  // 方案 B = 裸线宽（lineScale 全当 1.0）——留着是为了随时看见「不抬会细成什么样」。
  var SH = { page: 0, zoom: 1, plan: 'A' };

  function sheetRoster(page) {
    var out = [], i, d;
    if (page === 0) {
      for (i = 0; i < MOBS.length; i++) {
        d = SJ.Enemies.defs[MOBS[i][0]];
        if (d) out.push({ name: MOBS[i][1], def: d });
      }
    } else {
      for (i = 0; i < BOSSES.length; i++) {
        d = SJ.Bosses.defs[BOSSES[i][0]];
        if (d) out.push({ name: BOSSES[i][1], def: d });
      }
      if (SJ.Bosses.defs.baiyi_ying) out.push({ name: '影', def: SJ.Bosses.defs.baiyi_ying });
    }
    return out;
  }

  // 这个角色的第一招的起手姿势（招表里读，别写死）
  function sheetWindPose(d) {
    var mid = (d.moves && d.moves[0]) || (d.sets && d.sets[0] && d.sets[0][0]);
    var m = mid && SJ.AI.moves[mid];
    return (m && m.poseW) || 'atk1_wind';
  }
  function sheetHurtPose(d) { return d.mass === 'heavy' ? 'crouch' : 'hurt'; }
  function sheetLS(d) {
    return SH.plan === 'A' ? (d.lineScale || 1) : 1;
  }

  var sheet = {
    update: function () { },
    draw: function (g) {
      var t = SJ.Game.time, list = sheetRoster(SH.page), i, r;
      SJ.Ink.paper(g, 0, 0);

      g.fillStyle = SJ.C.ink;
      g.font = '15px ui-serif,serif';
      g.fillText('敌人总表 · ' + (SH.page === 0 ? '杂兵' : 'Boss') +
        ' · ' + (SH.plan === 'A' ? '现状' : '裸线宽 1.0') + (SH.zoom > 1 ? ' · ×' + SH.zoom : '') +
        '   （1/2 换页 · L 现状↔裸线宽 · Z 放大 · S 回试炼场）', 16, 24);
      g.font = '11px ui-monospace,monospace';
      g.fillStyle = SJ.C.inkLight;
      g.fillText('列 = 角色，行 = 待机 / 起手 / 受击。右上角是 scale × lineScale = 纸上实际墨重。', 16, 42);

      var cols = list.length, cw = SJ.W / cols, rowY = [170, 310, 450];
      var rows = ['待机', '起手', '受击'];
      for (i = 0; i < rows.length; i++) {
        g.fillStyle = SJ.C.inkLight;
        g.font = '11px ui-serif,serif';
        g.fillText(rows[i], 4, rowY[i] - 4);
        SJ.Ink.stroke(g, [[10, rowY[i] + 1], [SJ.W - 10, rowY[i] + 1]],
          { w0: 1, w1: 1, color: SJ.C.ink2, alpha: 0.22, seed: i * 5 });
      }

      for (i = 0; i < cols; i++) {
        r = list[i];
        var d = r.def, x = cw * (i + 0.5), sc = (d.scale || 0.86) * SH.zoom, ls = sheetLS(d);
        var poses = ['idle', sheetWindPose(d), sheetHurtPose(d)];

        g.fillStyle = SJ.C.ink;
        g.font = '12px ui-serif,serif';
        g.textAlign = 'center';
        g.fillText(r.name, x, 66);
        g.font = '10px ui-monospace,monospace';
        g.fillStyle = SJ.C.inkLight;
        g.fillText('s' + (d.scale || 0.86).toFixed(2) + ' × l' + ls.toFixed(2), x, 80);
        g.fillStyle = ((d.scale || 0.86) * ls) < 0.95 ? SJ.C.cinnabar : SJ.C.stone;
        g.fillText('墨重 ' + ((d.scale || 0.86) * ls).toFixed(2) + ' · ' + (d.mass || '?'), x, 92);
        g.textAlign = 'left';

        for (var k = 0; k < 3; k++) {
          SJ.Figure.draw(g, {
            x: x, y: rowY[k], facing: 1, scale: sc,
            // 受击取 p=0.22（刚被打到、还在后仰）；p 拉到 0.6 之后 hurt 已经收回来了，
            // 看着跟待机一样，就白画了
            pose: poses[k], p: k === 0 ? 0 : k === 1 ? 0.62 : 0.22, t: t * 0.6 + i,
            weapon: d.weapon === undefined ? null : d.weapon,
            color: d.color || SJ.C.ink, alpha: 1, lineScale: ls, cloth: 0.35
          });
        }
      }
    }
  };

  function toSheet() {
    SJ.Ent.clear();
    SJ.Combat.clear();
    SJ.FX.clear();
    // 面板压在画布右侧四分之一上，总表最后两列会被挡住 —— 进总表就收起来
    SH.panelWas = D.hidePanel;
    D.hidePanel = true; panel.className = 'hide';
    SJ.Game.setScene(sheet);
  }
  function toArena() {
    D.hidePanel = !!SH.panelWas; panel.className = D.hidePanel ? 'hide' : '';
    SJ.Ent.clear(); SJ.Combat.clear();
    SJ.Game.setScene(scene);
  }


  // ── 动态取帧（T3）：按「画面上正好有想看的东西」这一条件卡帧存图 ──────
  // 静态总表看不见残影叠线宽、影的半透明、双线在运动中会不会并成一条。
  // 所以这里不定时截图，而是每帧问一句「该看的都在场了吗」，在场才存。
  // 入口：enemy.html#dyn:<场景>[:obs]   obs = 按观势的清晰画法画（玩家读线时看到的）
  var DYN = {
    // 白衣 P3 的孤影：瞬移留残影 → 残影还在时起手。grab 双线叠在残影上
    baiyi_trail: function () {
      var b = spawn('boss', 'baiyi', 320);
      if (b) { b.setPhase(3); b.invuln = 0; b.act = 'idle'; b.shiftT = 0; }
      return function () {
        if (!b || b.mv) return false;
        SJ.AI.start(b, SJ.AI.moves.guying);
        return true;
      };
    },
    // 白衣 P3 + 三个影 + 遍照：本体一道朱砂 heavy，三个影三道石青假线
    baiyi_clones: function () {
      var b = spawn('boss', 'baiyi', 300);
      if (b) { b.setPhase(3); b.invuln = 0; b.act = 'idle'; b.shiftT = 0; }
      var step = 0;
      return function () {
        if (!b) return false;
        if (step === 0) { if (b.mv) return false; SJ.AI.start(b, SJ.AI.moves.b_fenshen); step = 1; return false; }
        if (step === 1) { if (b.mv || SJ.Bosses.clones(b).length < 2) return false; step = 2; return false; }
        if (step === 2) { SJ.AI.start(b, SJ.AI.moves.b_bianzhao); step = 3; }
        return true;
      };
    },
    // 刺客的闪：瞬移之后人站住，线在动
    cike_shan: function () {
      var e = spawn('mob', 'cike', 300);
      return function () {
        if (!e || e.mv) return false;
        SJ.AI.start(e, SJ.AI.moves.k_shan);
        return true;
      };
    },
    // 力士冲撞：人跟着线一起往前跑
    lishi_zhuang: function () {
      var e = spawn('mob', 'lishi', 340);
      return function () {
        if (!e || e.mv) return false;
        SJ.AI.start(e, SJ.AI.moves.k_zhuang);
        return true;
      };
    },
    // 三档同屏：light 破雨 / heavy 镇山 / grab 冲撞，同一帧起手，直接比
    tiers: function () {
      var a = spawn('mob', 'daoke', -300),
          b = spawn('mob', 'qiangbing', 60),
          c = spawn('mob', 'lishi', 420);
      return function () {
        if (!a || !b || !c) return false;
        if (a.mv || b.mv || c.mv) return false;
        SJ.AI.start(a, SJ.AI.moves.poyu);
        SJ.AI.start(b, SJ.AI.moves.zhenshan);
        SJ.AI.start(c, SJ.AI.moves.k_zhuang);
        return true;
      };
    }
  };

  // 起手式走到中段（0.35–0.72）才存：太早线还没铺开，太晚珠子已经到底了。
  // ?pw=<lo>,<hi> 可以改窗口 —— heavy 的势点随进度变实，早段和末段要分开看。
  var DYNW = (function () {
    var m = /[?&]pw=([\d.]+),([\d.]+)/.exec(location.search || '');
    return m ? [parseFloat(m[1]), parseFloat(m[2])] : [0.35, 0.72];
  })();
  function dynReady() {
    var T = SJ.Combat.tgList, i, n = 0;
    for (i = 0; i < T.length; i++) {
      if (T[i].dead || !T[i].owner) continue;
      var p = T[i].t / T[i].dur;
      if (p < DYNW[0] || p > DYNW[1]) return false;
      n++;
    }
    return n > 0;
  }
  function dynTrail() {
    var L = SJ.FX.list, i;
    for (i = 0; i < L.length; i++) if (L[i].k === 'trail') return true;
    return false;
  }

  function dynRun(name, obs) {
    var mk = DYN[name];
    if (!mk) { console.warn('[试炼场] 没有这个动态场景：' + name); return; }
    D.lock = false;
    // 面板占掉画布右四分之一，画布的实际像素跟着变小 —— 判「糊不糊」的图不能先自己降一档分辨率
    D.hidePanel = true; panel.className = 'hide';
    clearFoes();
    SJ.Combat.debug.tgAlways = !!obs;
    var fire = mk(), armed = false, fired = false, frames = 0;
    // 需要残影的场景多等一条：残影必须还活着
    var needTrail = /trail|shan/.test(name);
    (function loop() {
      requestAnimationFrame(function () {
        frames++;
        if (!fired) { fired = fire(); }
        else if (!armed && dynReady() && (!needTrail || dynTrail())) {
          armed = true;
          var png = document.getElementById('c').toDataURL('image/png');
          fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 't3_dyn_' + name + (obs ? '_obs' : '_raw') + (DYNW[0] > 0.5 ? '_late' : ''),
              png: png, stats: {} }) });
          console.log('[试炼场] 已存 ' + name + ' @frame ' + frames);
          return;
        }
        if (frames > 1200) { console.warn('[试炼场] ' + name + ' 20s 内没等到取帧条件'); return; }
        loop();
      });
    })();
  }
  // ── 启动 ──────────────────────────────────────────────────
  SJ.Save.load();
  if (!SJ.Save.data.slots) SJ.Save.data.slots = [null, null, null, null];
  if (!SJ.Save.data.known) SJ.Save.data.known = [];
  buildPanel();
  renderSlots();
  SJ.Game.init(document.getElementById('c'));
  SJ.Game.setScene(scene);
  // Lead 补：无头截图入口  #sheet:<页 1|2>:<方案 A|B>  例如 enemy.html#sheet:1:B
  (function () {
    var m = /^#sheet(?::(\d))?(?::([AB]))?/.exec(location.hash || '');
    if (!m) {
      // #dyn 走另一条路（T3 的动态取帧），不能被 #sheet 的 return 挡掉
      var d0 = /^#dyn:([\w]+)(?::(obs))?/.exec(location.hash || '');
      if (d0) setTimeout(function () { dynRun(d0[1], !!d0[2]); }, 400);
      return;
    }
    if (m[1]) SH.page = (m[1] | 0) - 1;
    if (m[2]) SH.plan = m[2];
    toSheet();
    // ?post=<name> 时 2s 后把画布 POST 给 dev/qa_server.py（/save），供无头截图
    var q = /[?&]post=([\w:-]+)/.exec(location.search || '');
    if (q) setTimeout(function () {
      var png = document.getElementById('c').toDataURL('image/png');
      fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: q[1], png: png, stats: {} }) });
    }, 2000);
  })();

  var started = false;
  function boot() { if (started) return; started = true; SJ.Audio.init(); }
  window.addEventListener('pointerdown', boot);
  window.addEventListener('keydown', boot);

  window.addEventListener('keydown', function (e) {
    if (e.code === 'KeyH') {
      D.hidePanel = !D.hidePanel;
      panel.className = D.hidePanel ? 'hide' : '';
    }
    if (e.code === 'KeyS') { (SJ.Game.scene === sheet ? toArena : toSheet)(); return; }
    if (SJ.Game.scene === sheet) {
      if (e.code === 'Digit1') SH.page = 0;
      if (e.code === 'Digit2') SH.page = 1;
      if (e.code === 'KeyL') SH.plan = SH.plan === 'A' ? 'B' : 'A';
      if (e.code === 'KeyZ') SH.zoom = SH.zoom > 1 ? 1 : 2;
      return;
    }
    if (e.code === 'KeyR') SJ.player.respawn(200, GY - 60);
    if (e.code === 'KeyQ') printStats();
    var n = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7']
      .indexOf(e.code);
    if (n >= 0) spawn('mob', MOBS[n][0]);
  });

  // 给浏览器自动化用的把手
  window.T = {
    D: D, stats: stats, spawn: spawn, clear: clearFoes, foes: foes,
    focus: function () { return focus; },
    print: printStats,
    reset: function () { wipeStats(); seen = {}; botClock = 0; },
    err: []
  };
  window.addEventListener('error', function (e) {
    window.T.err.push(e.message + ' @' + e.filename + ':' + e.lineno);
    console.error('[试炼场·异常]', e.message, e.filename + ':' + e.lineno);
  });
})();
</script>
